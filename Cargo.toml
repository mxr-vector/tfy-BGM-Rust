[package]
name = "tfy-bgm-gpui"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "听风吟 BGM 曲库的 GPUI 桌面客户端"
license = "Apache-2.0"
publish = false

[workspace]
members = ["core"]

[dependencies]
anyhow = "1"
bgm-core = { path = "core" }
chrono = "0.4"
cpal = "0.18"
dirs = "6"
fastrand = "2"
gpui = "0.2.2"
http = "1"
httparse = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libloading = "0.8"
notify = "8"
rodio = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
unicode-segmentation = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
core-foundation = "0.10"
core-video = "0.4"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSAccessibility", "NSAlert", "NSApplication", "NSImage", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSEvent", "NSFont", "NSFontManager", "NSMenu", "NSMenuItem", "NSResponder", "NSScrollView", "NSScreen", "NSText", "NSTextView", "NSView", "NSWindow", "NSWorkspace", "block2", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSBundle", "NSCharacterSet", "NSData", "NSDictionary", "NSLocale", "NSObject", "NSObjCRuntime", "NSRange", "NSString", "NSNotification", "NSURL", "NSValue"] }
raw-window-handle = "0.6"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "symbols"
panic = "unwind"
