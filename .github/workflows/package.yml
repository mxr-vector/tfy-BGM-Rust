# 在 GitHub 上构建各平台安装包，产物命名与本地脚本保持一致：
#   tfy-bgm-<版本>-windows-<arch>-portable.zip        arch = x64 | arm64
#   tfy-bgm-<版本>-windows-<arch>-setup.exe
#   tfy-bgm-<版本>-linux-<arch>.deb                   arch = amd64 | arm64
#   tfy-bgm-<版本>-linux-<arch>.rpm                   arch = x86_64 | aarch64
#
# 触发方式：
#   1. 推送 v* 标签——检查版本 + 构建 x64/arm64 全平台 + 自动创建 Release 并挂上全部产物与 SHA256SUMS.txt
#   2. 手动 workflow_dispatch——勾选要打的包与架构，只构建，产物在 Run 页面底部下载
#
# 手动触发的勾选项：
#   - 包：Windows 绿色版 / Windows 安装版 / Linux deb / Linux rpm，可任意组合；
#     没勾选的包不会编译，对应的作业也不会启动。
#   - 架构：手动触发默认 x64，可选 arm64 / both；推送 v* 标签时固定构建 both（x64 + arm64）。
#     arm64 用原生 ARM 运行器（windows-11-arm、ubuntu-24.04-arm），不做交叉编译；
#     首次运行要重新编译依赖，会比 x64 慢。
#   - 程序包不含曲库；独立 bgm.zip 可单独构建，标签发布时全平台共用一份。
#   - 只勾绿色版时不安装 tauri-cli；同时勾安装版时先出 NSIS 再复用同一份 exe 组装绿色版，
#     省掉一次前端构建与 Rust 增量检查。
#
# 运行器选择（省资源）：
#   plan / release 跑 ubuntu-slim：1 核容器，分钟数远低于 4 核 VM，只做检查、下载、上传，够用。
#   打包必须用完整 VM：slim 镜像里没有 gcc / WebKitGTK，容器是非特权的装不了系统库，
#   而且单 job 上限 15 分钟，Tauri 全量编译会直接超时。
#
# 注意：
#   - 标签名（去掉 v）必须与 src-tauri/tauri.conf.json 的 version 一致，否则 plan 直接失败。
#   - NSIS / deb / rpm 随包提供 CPU 分离模型，不包含 GPU 推理环境。
#   - Linux 用 ubuntu-24.04：只支持 glibc ≥ 2.39 的系统（Ubuntu 24.04+ / Debian 13+ / Fedora 40+），
#     更老的发行版不在支持范围内，不再做兼容处理。
#   - Tauri 直接生成 deb / rpm；dpkg-deb 和 rpm 只用于校验包元数据。

name: Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      windows_portable:
        description: "Windows 绿色版 (portable zip)"
        type: boolean
        default: true
      windows_installer:
        description: "Windows 安装版 (NSIS setup.exe)"
        type: boolean
        default: true
      linux_deb:
        description: "Linux deb"
        type: boolean
        default: true
      linux_rpm:
        description: "Linux rpm"
        type: boolean
        default: true
      bgm_library:
        description: "独立曲库 ZIP"
        type: boolean
        default: false
      windows_arch:
        description: "Windows 架构"
        type: choice
        options:
          - x64
          - arm64
          - both
        default: x64
      linux_arch:
        description: "Linux 架构"
        type: choice
        options:
          - x64
          - arm64
          - both
        default: x64

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 一次性把「标签校验 + 勾选结果」算成下游作业直接可用的输出，省掉后续作业重复判断。
  plan:
    name: Plan
    runs-on: ubuntu-slim
    outputs:
      windows_arch: ${{ steps.plan.outputs.windows_arch }}
      linux_arch: ${{ steps.plan.outputs.linux_arch }}
      portable: ${{ steps.plan.outputs.portable }}
      nsis: ${{ steps.plan.outputs.nsis }}
      deb: ${{ steps.plan.outputs.deb }}
      rpm: ${{ steps.plan.outputs.rpm }}
      library: ${{ steps.plan.outputs.library }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve build plan
        id: plan
        env:
          INPUT_PORTABLE: ${{ inputs.windows_portable }}
          INPUT_NSIS: ${{ inputs.windows_installer }}
          INPUT_DEB: ${{ inputs.linux_deb }}
          INPUT_RPM: ${{ inputs.linux_rpm }}
          INPUT_LIBRARY: ${{ inputs.bgm_library }}
          INPUT_WINDOWS_ARCH: ${{ inputs.windows_arch }}
          INPUT_LINUX_ARCH: ${{ inputs.linux_arch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          dispatch = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"

          def flag(name):
              # 推标签时没有 inputs，默认构建全部包。
              if not dispatch:
                  return True
              return os.environ.get(name, "false") == "true"

          def arches(name):
              if not dispatch:
                  return ["x64", "arm64"]
              value = os.environ.get(name, "x64")
              if value == "both":
                  return ["x64", "arm64"]
              if value not in ("x64", "arm64"):
                  print(f"::error::未知架构: {value}")
                  sys.exit(1)
              return [value]

          def matrix(name, platforms):
              return json.dumps([{"arch": arch, "runner": platforms[arch][0], "target": platforms[arch][1]}
                                 for arch in arches(name)])

          portable = flag("INPUT_PORTABLE")
          nsis = flag("INPUT_NSIS")
          deb = flag("INPUT_DEB")
          rpm = flag("INPUT_RPM")
          library = flag("INPUT_LIBRARY")

          if dispatch and not (portable or nsis or deb or rpm or library):
              print("::error::没有勾选任何产物，至少选择一个包")
              sys.exit(1)

          with open("src-tauri/tauri.conf.json", encoding="utf-8") as conf:
              version = json.load(conf)["version"]
          if os.environ["GITHUB_REF"].startswith("refs/tags/v"):
              tag = os.environ["GITHUB_REF_NAME"][1:]
              print(f"tag={tag} version={version}")
              if tag != version:
                  print(f"::error::标签 {tag} 与 tauri.conf.json 的版本 {version} 不一致，先改版本再打标签")
                  sys.exit(1)

          values = {
              "portable": str(portable).lower(),
              "nsis": str(nsis).lower(),
              "deb": str(deb).lower(),
              "rpm": str(rpm).lower(),
              "library": str(library).lower(),
              "version": version,
              "windows_arch": matrix("INPUT_WINDOWS_ARCH", {
                  "x64": ("windows-latest", "x86_64-pc-windows-msvc"),
                  "arm64": ("windows-11-arm", "aarch64-pc-windows-msvc"),
              }) if portable or nsis else "[]",
              "linux_arch": matrix("INPUT_LINUX_ARCH", {
                  "x64": ("ubuntu-24.04", "x86_64-unknown-linux-gnu"),
                  "arm64": ("ubuntu-24.04-arm", "aarch64-unknown-linux-gnu"),
              }) if deb or rpm else "[]",
          }
          print(values)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in values.items():
                  out.write(f"{key}={value}\n")
          PY

  windows:
    name: Windows ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.windows_arch != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows_arch) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # sherpa-onnx 的静态库约 127 MB（解压后 1 GB），由打包脚本预取并校验；
      # 只缓存压缩包，解压后放在 .cache/ 而不是 target/ —— rust-cache 会裁剪
      # target/，把解压目录留在里面就会出现「有 -L 但没有 .lib」的链接错误。
      - uses: actions/cache@v6
        with:
          path: .cache/sherpa-onnx/archives
          key: sherpa-libs-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sherpa-libs-${{ runner.os }}-${{ matrix.arch }}-

      # tauri-cli 编译一次要几分钟；带上 .crates.toml，命中缓存时 cargo install 会直接跳过。
      # 只有打 NSIS 才需要，绿色版直接 cargo build。
      - uses: actions/cache@v6
        if: needs.plan.outputs.nsis == 'true'
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tauri-cli
        if: needs.plan.outputs.nsis == 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # 先出 NSIS：cargo tauri build 会顺带产出带 custom-protocol 的 release exe，
      # 后面的绿色版用 -SkipBuild 复用，不再跑一遍 pnpm build + cargo build。
      - name: NSIS installer
        if: needs.plan.outputs.nsis == 'true'
        run: powershell -ExecutionPolicy Bypass -File scripts/package-installer.ps1 -Target ${{ matrix.target }}

      - name: Portable package
        if: needs.plan.outputs.portable == 'true'
        shell: pwsh
        run: |
          $cmd = @("-ExecutionPolicy", "Bypass", "-File", "scripts/package-portable.ps1", "-Target", '${{ matrix.target }}')
          if ('${{ needs.plan.outputs.nsis }}' -eq 'true') { $cmd += "-SkipBuild" }
          powershell @cmd

      # 只传最终文件，dist/tfy-bgm/ 组装目录不进 artifact，省一次几百 MB 的上传。
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/tfy-bgm-${{ needs.plan.outputs.version }}-windows-${{ matrix.arch }}-portable.zip
            dist/tfy-bgm-${{ needs.plan.outputs.version }}-windows-${{ matrix.arch }}-setup.exe
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  linux:
    name: Linux ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.linux_arch != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_arch) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      # 同上：sherpa-onnx 原生库走独立缓存，与 target/ 的裁剪互不影响。
      - uses: actions/cache@v6
        with:
          path: .cache/sherpa-onnx/archives
          key: sherpa-libs-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            sherpa-libs-${{ runner.os }}-${{ matrix.arch }}-

      # bgm-core 不依赖 Tauri，不用装 WebKitGTK；链接测试二进制需要 gcc（镜像自带）。
      # 仓库根目录没有 Cargo.toml，workspace 在 src-tauri/。
      # 两种架构都跑会重复编译，只在 x64 上跑一次。
      - name: cargo test -p bgm-core
        if: matrix.arch == 'x64'
        working-directory: src-tauri
        run: cargo test -p bgm-core

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            rpm

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-v2

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # deb 与 rpm 都是 tauri 内置打包器直出的，不需要 rpmbuild；这里只装编译依赖。
      - name: Build packages
        env:
          DEB: ${{ needs.plan.outputs.deb }}
          RPM: ${{ needs.plan.outputs.rpm }}
        run: |
          formats=()
          if [ "$DEB" = "true" ]; then formats+=(deb); fi
          if [ "$RPM" = "true" ]; then formats+=(rpm); fi
          bash scripts/package-linux.sh --target '${{ matrix.target }}' "${formats[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/tfy-bgm-${{ needs.plan.outputs.version }}-linux-${{ matrix.arch == 'arm64' && 'arm64' || 'amd64' }}.deb
            dist/tfy-bgm-${{ needs.plan.outputs.version }}-linux-${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}.rpm
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  library:
    name: Shared BGM library
    needs: plan
    if: needs.plan.outputs.library == 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/package-library.py
      - uses: actions/upload-artifact@v7
        with:
          name: bgm-library
          path: dist/bgm.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [plan, windows, linux, library]
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify release files and write checksums
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cd artifacts
          prefix="tfy-bgm-$VERSION"
          expected=("$prefix"-windows-{x64,arm64}-{portable.zip,setup.exe}
                    "$prefix"-linux-{amd64,arm64}.deb
                    "$prefix"-linux-{x86_64,aarch64}.rpm
                    bgm.zip)
          diff -u <(printf '%s\n' "${expected[@]}" | sort) \
            <(find . -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          for asset in "${expected[@]}"; do test -f "$asset"; done
          sha256sum "${expected[@]}" > SHA256SUMS.txt

      # softprops/action-gh-release@v3 会先创建草稿再上传，重跑失败时会把
      # 同一 tag 的发布入口变成草稿。已有 Release 直接更新，保持发布状态。
      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(artifacts/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "error: 没有可发布的构建产物" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            # 先上传再修正状态：已发布版本全程保持 published，不会退化成草稿。
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" \
              --draft=false --prerelease=false --latest
          else
            # 新 tag 直接创建正式 Release，不创建中间草稿。
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes \
              --draft=false --prerelease=false --latest
          fi

          release_json="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")"
          jq -e '.draft == false and .prerelease == false' <<<"$release_json" >/dev/null
          diff -u <(printf '%s\n' "${assets[@]##*/}" | sort) \
            <(jq -r '.assets[].name' <<<"$release_json" | sort)
          jq -r '"Release ready: \(.html_url)"' <<<"$release_json"
