[package]
name = "tfy-bgm"
version = "0.9.0-tauri2"
description = "听风吟 · 视频剪辑 BGM 音频素材库（Rust + Tauri 桌面客户端）"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
default-run = "tfy-bgm"

[workspace]
members = ["core"]

[lib]
name = "tfy_bgm_lib"
# 桌面端只按 rlib 链接；staticlib / cdylib 只有移动端才需要，
# 开着会让每次编译多出数 GB 的 .lib / .dll 和静态库临时对象文件。
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = "0.8"
bgm-core = { path = "core" }
# 解析系统「下载」目录（Windows FOLDERID_Downloads / Linux XDG_DOWNLOAD_DIR）作为模型默认位置。
dirs = "7"
libloading = "0.7"
notify = "8.2"
parking_lot = "0.12"
# 下载 ASR 模型：阻塞式客户端 + rustls，避免依赖系统 OpenSSL。
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots"] }
# ASR 推理引擎：sherpa-onnx 的 Rust API（构建时自动下载对应平台的预编译库）。
sherpa-onnx = "2"
# 在线朗读：Microsoft Edge Read Aloud 的 WebSocket 客户端（无需下载模型）。
edge-tts-rust = "0.1.7"
# 解码 edge-tts 返回的 MP3 音频（纯 Rust，不依赖 ffmpeg）。
symphonia-core = "0.5"
symphonia-bundle-mp3 = "0.5"
# reqwest 0.12/0.13 分别启用了 ring 与 aws-lc-rs，rustls 无法自动选择进程级
# CryptoProvider；WebSocket 建连前必须显式安装，否则会 panic。
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
# 人声分离直接调用 sherpa-onnx 的 C API：Rust 封装尚未暴露 OfflineSourceSeparation。
sherpa-onnx-sys = "2"
# 首次使用模型时校验 SHA-256 并解压下载的代码包。
bzip2 = "0.4"
flate2 = "1"
tar = "0.4"
zip = "9"
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# 读取字体文件的 name 表，得到系统字体的真实族名（含中文名），只依赖 std。
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }

tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 视频壁纸通过本地 HTTP Range 流喂给 WebKitGTK，避免 asset 协议无法播放媒体。
tokio-util = { version = "0.7", features = ["io"] }
# 本地壁纸媒体地址使用不可预测的随机令牌，避免其它本机进程枚举文件。
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
# 开机自动启动：写入 HKCU 的 Run 项，不需要额外安装器。
windows-registry = "0.6"

[features]
# 绿色版脚本用 cargo 直接构建时需要显式开启，否则 Tauri 会按开发模式去连接 devUrl。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

# 开发构建只保留行号信息：PDB / rlib 明显变小，backtrace 仍有文件与行号。
[profile.dev]
debug = "line-tables-only"

# 体积大头是三方差依赖的调试信息，这里关掉，只保留本项目代码可单步调试。
[profile.dev.package."*"]
debug = false
