[package]
name = "tfy-bgm"
version = "1.0.0"
description = "听风吟 · 视频剪辑 BGM 音频素材库（Rust + Tauri 桌面客户端）"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
default-run = "tfy-bgm"

[workspace]
members = ["core"]

[lib]
name = "tfy_bgm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
axum = "0.8"
bgm-core = { path = "core" }
notify = "8.2"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[target.'cfg(windows)'.dependencies]
# 开机自动启动：写入 HKCU 的 Run 项，不需要额外安装器。
windows-registry = "0.6"

[features]
# 绿色版脚本用 cargo 直接构建时需要显式开启，否则 Tauri 会按开发模式去连接 devUrl。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
