[package]
name = "bgm-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
description = "Device-independent library, preferences and export logic for TFY BGM"

[dependencies]
lofty = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"