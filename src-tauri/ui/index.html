<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>听风吟 · BGM</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-logo" id="brand-logo"></div>
          <div class="brand-text">
            <span class="brand-title" id="brand-title">听风吟 · BGM</span>
            <span class="brand-subtitle" id="brand-subtitle">剪辑音频素材库</span>
          </div>
        </div>

        <div class="search-box">
          <span class="search-icon" data-icon="search"></span>
          <input
            id="search-input"
            class="search-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="搜索曲名或风格，如 欢快 / 古风 / 史诗"
          />
          <button type="button" class="clear-search-btn" id="btn-clear-search" title="清除搜索" hidden>
            <span data-icon="x"></span>
          </button>
          <kbd
            class="search-kbd"
            id="search-confirm-hint"
            title="回车确认搜索 · 按 / 快速聚焦"
            aria-label="按 / 快速聚焦搜索"
          >/</kbd>
        </div>

        <div class="top-actions">
          <button type="button" class="toolbar-btn" id="btn-import" title="导入本地 MP3 到曲库">
            <span data-icon="upload"></span><span class="toolbar-label">导入音乐</span>
          </button>
          <label class="sort-box" title="切换排序方式">
            <span class="sort-icon" data-icon="sort"></span>
            <select id="sort-select" class="sort-select">
              <option value="default">默认推荐</option>
              <option value="name">按曲名 A–Z</option>
            </select>
            <span class="sort-caret" data-icon="chevron-down"></span>
          </label>
          <span class="top-divider" aria-hidden="true"></span>
          <button type="button" class="icon-tool" id="btn-config" title="打开应用配置 config.json" aria-label="打开应用配置">
            <span data-icon="settings"></span>
          </button>
        </div>
      </header>

      <aside class="sidebar">
        <nav class="side-nav" aria-label="曲库导航">
          <span class="nav-section-label">浏览</span>
          <button type="button" class="nav-item" id="nav-all" title="音乐库">
            <span class="nav-icon" data-icon="music"></span>
            <span class="nav-label">音乐库</span>
            <span class="nav-count" id="count-all">0</span>
          </button>
          <button type="button" class="nav-item nav-item-fav" id="nav-favorites" title="我的收藏">
            <span class="nav-icon nav-icon-heart" data-icon="heart"></span>
            <span class="nav-label">我的收藏</span>
            <span class="nav-count is-pink" id="count-favorites">0</span>
          </button>
          <button type="button" class="nav-item" id="nav-queue" title="播放队列">
            <span class="nav-icon" data-icon="list-music"></span>
            <span class="nav-label">播放队列</span>
            <span class="nav-count" id="count-queue">0</span>
          </button>

          <div class="nav-section">
            <span class="nav-section-label">曲库管理</span>
            <button type="button" class="nav-item is-sub" id="btn-rescan" title="重新扫描曲库目录并热加载配置">
              <span class="nav-icon" data-icon="refresh"></span>
              <span class="nav-label">重新扫描</span>
            </button>
            <button type="button" class="nav-item is-sub" id="btn-choose" title="选择其他曲库文件夹">
              <span class="nav-icon" data-icon="folder"></span>
              <span class="nav-label">切换曲库目录</span>
            </button>
            <button type="button" class="nav-item is-sub" id="btn-open" title="在文件管理器中打开曲库目录">
              <span class="nav-icon" data-icon="external"></span>
              <span class="nav-label">打开曲库文件夹</span>
            </button>
            <button type="button" class="nav-item is-sub" id="btn-reset" title="恢复使用随应用分发或开发仓库中的曲库" hidden>
              <span class="nav-icon" data-icon="rotate"></span>
              <span class="nav-label">恢复内置曲库</span>
            </button>
          </div>
        </nav>

        <div class="side-status">
          <div class="status-row">
            <span class="status-indicator"><i class="status-dot"></i>曲库就绪</span>
            <span class="status-count" id="status-count">0 首</span>
          </div>
          <span class="status-path" id="status-path">正在扫描曲库…</span>
        </div>
      </aside>

      <main class="workspace">
        <section class="warning-banner" id="warning-banner" hidden></section>

        <section class="category-hero" id="hero"></section>

        <div class="filter-row">
          <div class="filter-strip" role="tablist" aria-label="风格筛选">
            <button type="button" class="filter-chip" id="chip-all" role="tab">
              <span class="chip-icon" data-icon="music"></span>
              <span class="chip-label">全部风格</span>
            </button>
            <div id="category-nav" class="filter-categories"></div>
            <button type="button" class="filter-chip is-ghost" id="btn-add-category" title="新增分类（也可右键分类）" aria-label="新增分类">
              <span class="nav-icon" data-icon="plus"></span>
              <span class="chip-label">新增分类</span>
            </button>
          </div>
        </div>

        <div class="results-header">
          <div class="results-info">
            <span class="results-title" id="results-title">全部音乐素材</span>
            <span class="results-count" id="results-count">0 首配乐</span>
          </div>
          <div class="search-hint" id="search-hint" hidden>
            正在筛选：<span id="search-hint-text"></span>
            <button type="button" id="btn-clear-search-2">清除</button>
          </div>
        </div>

        <section class="batch-bar" id="batch-bar" hidden>
          <div class="batch-info">
            <span class="batch-count" id="batch-count">已选 0 首</span>
            <span class="batch-hint">对选中曲目执行批量操作</span>
          </div>
          <div class="batch-actions">
            <button type="button" class="batch-btn" data-batch-action="export">
              <span data-icon="download"></span><span>导出</span>
            </button>
            <button type="button" class="batch-btn" data-batch-action="move">
              <span data-icon="folder"></span><span>移动分类</span>
            </button>
            <button type="button" class="batch-btn is-danger" data-batch-action="delete">
              <span data-icon="trash"></span><span>删除</span>
            </button>
            <button type="button" class="batch-btn" data-batch-action="clear">
              <span data-icon="x"></span><span>取消选择</span>
            </button>
          </div>
        </section>

        <section class="empty-results" id="empty-state" hidden></section>

        <section class="songs-table" id="song-table">
          <div class="table-header">
            <span class="th-check">
              <input type="checkbox" id="select-all" aria-label="全选当前列表" />
            </span>
            <span class="th-index">#</span>
            <span class="th-title">曲目</span>
            <span class="th-actions">操作</span>
          </div>
          <div class="table-body" id="song-list"></div>
        </section>
      </main>

      <footer class="audio-player" id="player">
        <div class="player-wrapper">
          <div class="progress-bar" id="progress" role="slider" aria-label="播放进度" tabindex="0">
            <div class="progress-track">
              <div class="progress-buffered" id="progress-buffered"></div>
              <div class="progress-played" id="progress-played"></div>
            </div>
            <div class="progress-thumb" id="progress-thumb"></div>
            <div class="hover-tooltip" id="hover-tooltip" hidden>00:00</div>
          </div>

          <div class="player-content">
            <div class="track-info">
              <div class="track-cover" id="now-cover">
                <span class="cover-icon" id="now-cover-icon" data-icon="disc"></span>
              </div>
              <div class="track-meta">
                <div class="title-row">
                  <span class="track-title" id="now-title">未在播放</span>
                  <span class="category-badge" id="now-category" hidden></span>
                </div>
                <span class="track-sub" id="now-sub">从曲库中选择一首配乐</span>
              </div>
              <button type="button" class="action-btn now-fav" id="btn-now-favorite" title="收藏当前曲目" hidden>
                <span data-icon="heart"></span>
              </button>
            </div>

            <div class="controls-section">
              <div class="buttons-row">
                <button type="button" class="control-btn" id="btn-mode" title="顺序播放">
                  <span data-icon="repeat"></span>
                </button>
                <button type="button" class="control-btn" id="btn-prev" title="上一首">
                  <span data-icon="skip-back"></span>
                </button>
                <button type="button" class="play-main-btn" id="btn-play" title="播放 (空格)">
                  <span data-icon="play-fill"></span>
                </button>
                <button type="button" class="control-btn" id="btn-next" title="下一首">
                  <span data-icon="skip-forward"></span>
                </button>
                <button type="button" class="speed-btn" id="btn-rate" title="调整播放倍速">1.0x</button>
              </div>
              <div class="time-display">
                <span class="time-current" id="time-current">00:00</span>
                <span class="time-separator">/</span>
                <span class="time-total" id="time-total">--:--</span>
              </div>
            </div>

            <div class="utility-section">
              <div class="volume-container">
                <button type="button" class="action-btn" id="btn-mute" title="静音切换 (M)">
                  <span data-icon="volume"></span>
                </button>
                <input type="range" class="volume-range" id="volume-range" min="0" max="1" step="0.01" value="0.85" aria-label="音量" />
                <span class="volume-percent" id="volume-percent">85%</span>
              </div>
              <button type="button" class="action-btn" id="btn-download" title="导出当前音频 (.mp3)">
                <span data-icon="download"></span>
              </button>
              <button type="button" class="action-btn queue-btn" id="btn-queue" title="播放队列">
                <span data-icon="list-music"></span>
                <span class="queue-count" id="queue-count">0</span>
              </button>
            </div>
          </div>

          <div class="playback-error" id="playback-error" hidden>
            <span data-icon="alert"></span>
            <span id="playback-error-text"></span>
          </div>
        </div>
      </footer>

      <div class="drawer-backdrop" id="drawer-backdrop" hidden>
        <aside class="drawer-panel" role="dialog" aria-label="播放队列">
          <div class="drawer-header">
            <div class="drawer-heading">
              <span class="drawer-icon" data-icon="list-music"></span>
              <h2 class="drawer-title">播放队列</h2>
              <span class="queue-badge" id="drawer-count">0 首</span>
            </div>
            <div class="drawer-actions">
              <button type="button" class="clear-all-btn" id="btn-clear-queue" hidden>
                <span data-icon="trash"></span><span>清空</span>
              </button>
              <button type="button" class="close-btn" id="btn-close-drawer" title="关闭队列">
                <span data-icon="x"></span>
              </button>
            </div>
          </div>
          <div class="drawer-body" id="queue-list"></div>
        </aside>
      </div>

      <div class="toast" id="toast" hidden></div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
